kind = "web"
previewPath = "/"
title = "Compass"
description = "A local business discovery app that helps people find, compare, and save neighborhood businesses through curated listings and search."
version = "1.0.0"
id = "artifacts/workflow-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22115

[services.development]
run = "pnpm --filter @workspace/workflow-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/workflow-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/workflow-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22115"
BASE_PATH = "/"
