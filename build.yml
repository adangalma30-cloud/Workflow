name: Build Compass

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Type-check and build Compass
    runs-on: ubuntu-latest

    steps:
      - name: Check out Compass
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check shared libraries
        run: pnpm run typecheck:libs

      - name: Type-check Compass
        run: pnpm --filter @workspace/workflow-app run typecheck

      - name: Build Compass
        run: pnpm --filter @workspace/workflow-app run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: compass-dist
          path: artifacts/workflow-app/dist
          if-no-files-found: error
          retention-days: 14